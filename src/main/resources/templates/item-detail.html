<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Item Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1 th:text="${item.name}">Item Name</h1>
    <p><strong>Type:</strong> <span th:text="${item.type}">Type</span></p>
    <p><strong>Category:</strong> <span th:text="${item.category}">Category</span></p>
    <p><strong>Location:</strong> <span th:text="${item.location}">Location</span></p>
    <p><strong>Description:</strong> <span th:text="${item.description}">Description</span></p>
    <p><strong>Contact:</strong> <span th:text="${item.contact}">Contact</span></p>

    <a href="/">Back to Home</a>
</body>
</html>
