<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report an Item</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Report a Lost or Found Item</h1>

    <form th:action="@{/post}" th:object="${item}" method="post">
        <label>Item Name:</label><br>
        <input type="text" th:field="*{name}" required><br><br>

        <label>Type:</label><br>
        <select th:field="*{type}" required>
            <option value="Lost">Lost</option>
            <option value="Found">Found</option>
        </select><br><br>

        <label>Category:</label><br>
        <select th:field="*{category}" required>
            <option value="Electronics">Electronics</option>
            <option value="ID Card">ID Card</option>
            <option value="Bag">Bag</option>
            <option value="Keys">Keys</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label>Campus Location:</label><br>
        <input type="text" th:field="*{location}" required><br><br>

        <label>Description:</label><br>
        <textarea th:field="*{description}"></textarea><br><br>

        <label>Your Contact:</label><br>
        <input type="text" th:field="*{contact}" required><br><br>

        <button type="submit" id="submitBtn">Submit</button>
    </form>

    <a href="/">Back to Home</a>
</body>
</html>
